name: Windows executable
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: agenthub-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      npm_config_msvs_version: '2022'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop dependencies and rebuild native PTY
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $env:PYTHON = (Get-Command python).Source
          "PYTHON=$env:PYTHON" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (Test-Path package-lock.json) { npm ci 2>&1 | Tee-Object artifacts/dependency-install.txt } else { npm install 2>&1 | Tee-Object artifacts/dependency-install.txt }
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Commit reproducible dependency lock and record source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Lock verified Windows desktop dependency tree'
            if ($LASTEXITCODE -ne 0) { throw 'Dependency lock commit failed' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Concurrent source update; abort stale release' }
          }
          "SOURCE_COMMIT=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Source checks and unit tests
        run: |
          npm run check 2>&1 | Tee-Object artifacts/static-check.txt
          if ($LASTEXITCODE -ne 0) { throw 'Static checks failed' }
          npm test 2>&1 | Tee-Object artifacts/unit-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed' }
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high 2>&1 | Tee-Object artifacts/production-audit.txt
          if ($LASTEXITCODE -ne 0) { throw 'Production dependency audit failed' }
      - name: Native Electron restart and live PTY continuity
        env:
          AGENTHUB_SMOKE_OUTPUT: ${{ github.workspace }}/artifacts/native-dev
        run: |
          npm run smoke:restart 2>&1 | Tee-Object artifacts/native-dev.txt
          if ($LASTEXITCODE -ne 0) { throw 'Native desktop restart test failed' }
      - name: Build Windows x64 NSIS installer
        run: |
          npm run dist:win 2>&1 | Tee-Object artifacts/windows-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed' }
      - name: Install the actual EXE silently
        run: |
          $installer = Get-ChildItem release/Opaya-*-Setup-x64.exe | Select-Object -First 1
          if (-not $installer) { throw 'No Windows installer was produced' }
          $destination = Join-Path $env:RUNNER_TEMP 'Opaya-Installed-Smoke'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$destination") -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer exit code: $($process.ExitCode)" }
          $exe = Join-Path $destination 'Opaya.exe'
          if (-not (Test-Path $exe)) { throw "Installed executable missing at $exe" }
          "AGENTHUB_TEST_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify installed EXE and session survival across process exit
        env:
          AGENTHUB_SMOKE_OUTPUT: ${{ github.workspace }}/artifacts/native-installed
        run: |
          npm run smoke:restart 2>&1 | Tee-Object artifacts/native-installed.txt
          if ($LASTEXITCODE -ne 0) { throw 'Installed EXE restart test failed' }
      - name: Checksums and build provenance
        run: |
          node scripts/checksums.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Checksums failed' }
          node -e "const fs=require('fs');fs.writeFileSync('release/BUILDINFO.json',JSON.stringify({version:require('./package.json').version,sourceCommit:process.env.SOURCE_COMMIT,runUrl:'https://github.com/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID,electron:require('electron/package.json').version,signed:false,liveProviderTests:false,nativeDevelopment:JSON.parse(fs.readFileSync('artifacts/native-dev/native-smoke-read.json')),nativeInstalled:JSON.parse(fs.readFileSync('artifacts/native-installed/native-smoke-read.json'))},null,2))"
          if ($LASTEXITCODE -ne 0) { throw 'Provenance generation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Opaya-Windows-x64
          path: |
            release/*.exe
            release/*SHA256SUMS.txt
            release/BUILDINFO.json
          if-no-files-found: error
      - name: Publish immutable unsigned preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version-build.$env:GITHUB_RUN_NUMBER"
          $assets = @(Get-ChildItem release/*.exe,release/*SHA256SUMS.txt,release/BUILDINFO.json | ForEach-Object { $_.FullName })
          gh release create $tag @assets --target $env:SOURCE_COMMIT --prerelease --title "Opaya $version - Windows preview" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; verified installer remains in workflow artifacts' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Opaya-Windows-verification
          path: |
            artifacts/*.txt
            artifacts/native-dev/*.json
            artifacts/native-dev/*.png
            artifacts/native-installed/*.json
            artifacts/native-installed/*.png
            artifacts/**/startup-error.txt
            artifacts/**/service-startup-error.txt
          if-no-files-found: warn
