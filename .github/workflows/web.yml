name: Web server
on:
  push:
    branches: [main]
    paths: ['web/**', 'deploy/**', 'package-lock.json', 'desktop/**', 'ui/**', '.github/workflows/web.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No install scripts: no Electron download and no native rebuild. The desktop packages are there for the tests
      # that start the web runtime (desktop/runtime.cjs).
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck --workspace web
      - run: npm test --workspace web
      - run: npm run build --workspace web
      - run: npm audit --workspace web --omit=dev --audit-level=high
      # The production images, built the same way as on the VPS (deploy/docker-compose.yml), and the Compose file.
      - run: docker build -f deploy/web.Dockerfile -t opaya-web:ci .
      - run: docker build -f deploy/runtime.Dockerfile -t opaya-runtime:ci .
      - run: GCP_PROJECT=opaya-ci docker compose -f deploy/docker-compose.yml config --quiet
