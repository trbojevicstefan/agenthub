name: macOS app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: opaya-macos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    # Each architecture builds natively: node-pty is compiled for the runner's CPU, and the packaged app is started
    # there for the restart test. Apple Silicon on macos-latest, Intel on the Intel image.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            script: dist:mac
          - arch: x64
            runner: macos-15-intel
            script: dist:mac:x64
    name: macos (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # No Apple Developer ID yet: electron-builder skips signing and scripts/mac-adhoc-sign.cjs ad-hoc signs instead.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop dependencies and rebuild native PTY
        run: |
          mkdir -p artifacts
          npm ci 2>&1 | tee artifacts/dependency-install.txt
          test "${PIPESTATUS[0]}" -eq 0
      - name: Source checks and unit tests
        run: |
          npm run check 2>&1 | tee artifacts/static-check.txt
          test "${PIPESTATUS[0]}" -eq 0
          npm test 2>&1 | tee artifacts/unit-tests.txt
          test "${PIPESTATUS[0]}" -eq 0
      - name: Native Electron restart and live PTY continuity
        id: smoke_dev
        continue-on-error: true
        env:
          AGENTHUB_SMOKE_OUTPUT: ${{ github.workspace }}/artifacts/native-dev
        run: |
          npm run smoke:restart 2>&1 | tee artifacts/native-dev.txt
          test "${PIPESTATUS[0]}" -eq 0
      - name: Build macOS DMG and ZIP (${{ matrix.arch }})
        run: |
          # Retry: the Electron download from github.com occasionally times out on hosted runners.
          for attempt in 1 2 3; do
            npm run ${{ matrix.script }} 2>&1 | tee -a artifacts/macos-build.txt
            status=${PIPESTATUS[0]}
            [ "$status" -eq 0 ] && break
            echo "Build attempt $attempt failed with $status"; [ "$attempt" -lt 3 ] && sleep $((attempt * 20))
          done
          test "$status" -eq 0
          ls -la release
      - name: Verify packaged app and session survival across process exit
        id: smoke_packaged
        continue-on-error: true
        env:
          AGENTHUB_SMOKE_OUTPUT: ${{ github.workspace }}/artifacts/native-packaged
        run: |
          # electron-builder writes release/mac-arm64 for Apple Silicon and release/mac for Intel.
          app=$(ls -d release/mac*/Opaya.app | head -1)
          test -d "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          AGENTHUB_TEST_EXE="$PWD/$app/Contents/MacOS/Opaya" npm run smoke:restart 2>&1 | tee artifacts/native-packaged.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Startup logs"; find artifacts/native-packaged -maxdepth 3 -type f \( -name '*.txt' -o -name '*.log' \) -print -exec tail -n 80 {} \; ; log show --last 3m --style compact --predicate 'process == "Opaya"' 2>/dev/null | tail -n 80 || true; echo "::endgroup::"
          fi
          test "$status" -eq 0
      - name: Build provenance
        env:
          SMOKE_DEV: ${{ steps.smoke_dev.outcome }}
          SMOKE_PACKAGED: ${{ steps.smoke_packaged.outcome }}
          ARCH: ${{ matrix.arch }}
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('release/BUILDINFO-mac-'+process.env.ARCH+'.json',JSON.stringify({version:require('./package.json').version,arch:process.env.ARCH,sourceCommit:process.env.GITHUB_SHA,runUrl:'https://github.com/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID,electron:require('electron/package.json').version,signed:'ad-hoc',notarized:false,nativeDevelopment:process.env.SMOKE_DEV,nativePackaged:process.env.SMOKE_PACKAGED},null,2))"
      - uses: actions/upload-artifact@v4
        with:
          name: Opaya-macOS-build-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/BUILDINFO-mac-*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Opaya-macOS-verification-${{ matrix.arch }}
          path: |
            artifacts/*.txt
            artifacts/native-dev/*.json
            artifacts/native-dev/*.png
            artifacts/native-packaged/*.json
            artifacts/native-packaged/*.png
            artifacts/**/startup-error.txt
            artifacts/**/service-startup-error.txt
            artifacts/**/service-startup.log
            artifacts/**/service-output.log
          if-no-files-found: warn
  # One release with both architectures and a single checksum file, which the in-app updater reads.
  publish:
    needs: macos
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Opaya-macOS-build-*
          path: release
          merge-multiple: true
      - name: Publish unsigned macOS preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          ls -la
          ls *.zip >/dev/null 2>&1 || { echo 'No macOS build succeeded.'; exit 1; }
          sha256sum *.dmg *.zip > darwin-SHA256SUMS.txt
          cat darwin-SHA256SUMS.txt
          version=$(node -p "require('../package.json').version")
          tag="v$version-mac.$GITHUB_RUN_NUMBER"
          { echo "**Downloads:** \`mac-arm64\` = Apple Silicon (M1 and later), \`mac-x64\` = Intel."; echo; cat ../docs/RELEASE_NOTES.md; } > notes.md
          gh release create "$tag" *.dmg *.zip darwin-SHA256SUMS.txt BUILDINFO-mac-*.json --target "$GITHUB_SHA" --prerelease --title "Opaya $version - macOS preview" --notes-file notes.md
