<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Opaya</title>
  <meta name="description" content="Opaya. One place. All your agents. opaya.dev">
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="theme-light.css">
  <script defer src="vendor/xterm.js"></script>
  <script defer src="vendor/addon-fit.js"></script>
  <script defer src="vendor/addon-unicode11.js"></script>
  <script defer src="vendor/addon-webgl.js"></script>
  <script defer src="vendor/addon-search.js"></script>
  <script defer src="vendor/addon-web-links.js"></script>
  <script defer src="terminal-core.js"></script>
  <script defer src="markdown.js"></script>
  <script defer src="app.js"></script>
  <script type="module" src="stage3d.js"></script>
</head>
<body>
  <div id="preview-banner" hidden>UI PREVIEW / Example workspace. No agents are connected.</div>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Agent navigation">
      <div class="brand"><button class="nav-opaya brand-opaya" data-action="opaya" title="Opaya Agent: installs, connects and troubleshoots your agents"><span class="opaya-mark small" aria-hidden="true"><img src="assets/opaya-logo.png" alt=""><i></i></span><span class="nav-opaya-text"><strong>Opaya Agent</strong><small id="opaya-nav-status">Set up</small></span></button><button class="icon-button brand-discover" data-action="discover" title="Discover installed agents and SSH hosts" aria-label="Discover agents"><span class="radar-icon"></span></button></div>
      <button class="nav-overview" data-action="overview" data-side="home" title="Home: your agents at a glance and quick actions"><span class="grid-icon" aria-hidden="true"></span> Home <span id="agent-count">0</span></button>
      <div id="agent-list" class="agent-list"></div>
      <div class="sidebar-bottom"><button class="nav-playground" data-action="playground" data-side="playground" title="Ask two agents the same question side by side"><span class="split-icon" aria-hidden="true"></span> Playground</button><button data-action="fleet" data-side="machines" title="Machines: every machine and its agents. Clone, migrate, share, uninstall."><span class="machine-icon" aria-hidden="true"></span> Machines <span id="host-count">0</span></button><button data-action="vault" data-side="vault" title="Opaya Vault: every API key and token, and which agents have it"><span class="vault-icon" aria-hidden="true"></span> Vault <span id="vault-count"></span></button><button data-action="settings" title="Theme and workspace preferences"><span class="settings-icon" aria-hidden="true">&#9881;</span> Settings</button><button data-action="help" data-side="help" title="Connection help, privacy and shortcuts"><span class="help-icon">?</span> Help</button><button type="button" class="sidebar-hide-btn" data-action="sidebar-hide" title="Hide the sidebar (Ctrl+B)"><span class="sidebar-hide-glyph" aria-hidden="true"></span> Hide sidebar <kbd>B</kbd></button></div>
    </aside>
    <aside id="agent-side" class="agent-side" hidden aria-label="Agent"></aside>
    <main class="main-area">
      <header id="topbar" class="topbar"></header>
      
      <div class="work-area"><div class="work-center"><section id="content" class="content" aria-live="off"></section><div id="dock-bottom" class="dock dock-bottom" hidden><div class="dock-grip horizontal" data-grip="bottom" role="separator" aria-orientation="horizontal" aria-label="Resize bottom panel" tabindex="0"></div><div class="dock-panes"><section id="terminal-panel" class="terminal-panel dock-pane" data-pane="terminal" hidden aria-label="Integrated terminal"><div class="terminal-toolbar"><div id="terminal-arrange" class="terminal-arrange" aria-label="Terminal windows"></div><div class="terminal-actions"><button type="button" class="term-btn" data-action="terminal-new" title="New terminal window: an agent's CLI or a shell" aria-haspopup="menu"><span aria-hidden="true">+</span> New</button><button type="button" class="term-icon term-more" data-action="terminal-more" title="Find, rename, hidden windows, separate window, saved output" aria-label="More terminal options" aria-haspopup="menu">&#8943;</button><button type="button" class="term-icon" data-action="dock-move" data-pane="terminal" title="Move to the side / bottom" aria-label="Move terminal"><span class="dock-move-glyph" aria-hidden="true"></span></button><button type="button" class="term-icon" data-action="terminal-hide" title="Hide terminal (Ctrl+`). Sessions keep running." aria-label="Hide terminal"><span class="term-hide-glyph" aria-hidden="true"></span></button></div></div><div id="terminal-search" class="terminal-search" hidden><input id="terminal-search-input" placeholder="Find in output" aria-label="Find in terminal output" autocomplete="off" spellcheck="false"><button type="button" data-find="prev" title="Previous (Shift+Enter)" aria-label="Previous match">&#8593;</button><button type="button" data-find="next" title="Next (Enter)" aria-label="Next match">&#8595;</button><button type="button" data-find="close" title="Close (Esc)" aria-label="Close search">&#10005;</button></div><div id="terminal-views" class="terminal-views"></div></section></div></div></div><div id="dock-right" class="dock dock-right" hidden><div class="dock-grip vertical" data-grip="right" role="separator" aria-orientation="vertical" aria-label="Resize side panel" tabindex="0"></div><div class="dock-panes"><section id="browser-panel" class="browser-panel dock-pane" data-pane="browser" hidden aria-label="Browser"><div class="browser-toolbar"><button type="button" class="term-icon" data-browser="back" title="Back" aria-label="Back">&#8592;</button><button type="button" class="term-icon" data-browser="forward" title="Forward" aria-label="Forward">&#8594;</button><button type="button" class="term-icon" data-browser="reload" title="Reload" aria-label="Reload">&#8635;</button><form id="browser-form" class="browser-address"><span class="browser-lock" aria-hidden="true"></span><input id="browser-url" placeholder="Search or enter an address" aria-label="Address" autocomplete="off" spellcheck="false"></form><span id="browser-agent" class="browser-agent" hidden><span class="status-dot working"></span> Agent browsing</span><button type="button" class="term-icon" data-browser="external" title="Open in your browser" aria-label="Open in your browser"><span class="term-popout-glyph" aria-hidden="true"></span></button><button type="button" class="term-icon" data-action="dock-move" data-pane="browser" title="Move to the side / bottom" aria-label="Move browser"><span class="dock-move-glyph" aria-hidden="true"></span></button><button type="button" class="term-icon" data-browser="close" title="Hide browser" aria-label="Hide browser"><span class="term-hide-glyph" aria-hidden="true"></span></button></div><div id="browser-view" class="browser-view"><div class="browser-empty"><strong>Opaya browser</strong><p>Links from agents open here. Agents you give the Opaya browser can open pages, read them, click and type while you watch.</p></div></div></section></div></div></div>
      <aside id="files-panel" class="files-panel" hidden aria-label="Files"></aside>
      
      <footer class="statusbar"><span id="status-left">One place. All your agents.</span><div id="status-tray" class="status-tray" aria-label="Chats in the background" hidden></div><button type="button" id="status-jobs" class="status-jobs" data-action="job-restore" hidden></button><button type="button" id="status-tools" class="status-update status-tools" data-action="tool-updates" hidden></button><button type="button" id="status-update" class="status-update" data-action="updates" hidden></button><span id="status-right">opaya.dev</span></footer>
    </main>
    <aside id="history-panel" class="projects-panel history-panel" hidden aria-label="Chat history"></aside>
    <aside id="projects-panel" class="projects-panel" hidden aria-label="Projects"></aside>
  </div>
  <div id="window-controls" class="window-controls" role="toolbar" aria-label="Window controls"></div>
  <div id="title-controls" class="title-controls" role="toolbar" aria-label="Sidebar, chat and terminal"></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
